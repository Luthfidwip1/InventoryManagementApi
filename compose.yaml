services:
  db:
    image: postgres:18
    container_name: inventory-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password

    ports:
      - "5433:5432"

    volumes:
      - inventory_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U inventory_user -d inventory_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: InventoryManagementApi/Dockerfile

    container_name: inventory-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=inventory_db;Username=inventory_user;Password=inventory_password
      TcpServer__Port: 5050

    ports:
      - "5064:8080"

    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: InventoryManagementWorker/Dockerfile

    container_name: inventory-worker
    restart: unless-stopped

    environment:
      TcpClient__Host: api
      TcpClient__Port: 5050
      TcpClient__TimeoutSeconds: 5
      Worker__StartupDelaySeconds: 5
      Worker__CycleIntervalSeconds: 30

    depends_on:
      - api

volumes:
  inventory_postgres_data: